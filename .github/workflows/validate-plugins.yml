name: Kiểm tra bộ plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài PyYAML
        run: pip install pyyaml

      - name: Kiểm giới hạn description (plugin.json 500, SKILL.md 1024)
        run: python3 scripts/check_descriptions.py

      # Trên main, workflow marketplace-sync.yml tự đồng bộ và commit lại bằng bot,
      # nên bước kiểm khớp chỉ chạy cho pull request để tránh đỏ giả do chạy song song.
      - name: Kiểm marketplace.json khớp plugin.json (chỉ pull request)
        if: github.event_name == 'pull_request'
        run: python3 scripts/sync_marketplace.py --check

      - name: Kiểm cấu trúc plugin
        run: |
          set -e
          loi=0
          for d in */.claude-plugin/plugin.json; do
            ten=$(basename "$(dirname "$(dirname "$d")")")
            if [ ! -f "$ten/skills/$ten/SKILL.md" ]; then
              echo "THIEU: $ten/skills/$ten/SKILL.md"; loi=1
            fi
            if [ -f "$ten/SKILL.md" ]; then
              echo "SAI CAU TRUC: $ten/SKILL.md nam o goc, phai o skills/$ten/"; loi=1
            fi
            khai=$(python3 -c "import json;print(json.load(open('$d',encoding='utf-8')).get('name',''))")
            if [ "$khai" != "$ten" ]; then
              echo "LECH TEN: thu muc $ten nhung plugin.json khai bao '$khai'"; loi=1
            fi
          done
          if find . -name '__pycache__' -not -path './.git/*' | grep -q .; then
            echo "CON __pycache__ trong repo"; loi=1
          fi
          exit $loi

  qa-evals:
    name: Hồi quy quy tắc soạn thảo vbhc-vn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai cong cu render va doc PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils

      - name: Cai thu vien Python
        run: pip install python-docx Pillow

      - name: Hoi quy lop 1 (mau that sach FAIL, file loi bi bat dung ma)
        run: python3 vbhc-vn/skills/vbhc-vn/tests/run_regression.py --voi-qa-all -v
