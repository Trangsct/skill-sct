name: Dong bo marketplace.json

# Tren nhanh main: TU DONG dong bo marketplace.json tu cac plugin.json, tu dong
# nang metadata.version roi commit nguoc lai. Khong con phai nho chay tay.
# So them voi catalog cua commit truoc (baseline) de van bump ca khi PR da sync
# san marketplace.json — do la ke ho tung lam claude.ai khong nhan catalog moi.
# Tren nhanh khac va pull request: chi nhac (khong bao do) khi lech version/mo ta,
# vi bot tren main se tu xu ly; loi cau truc (thieu/thua plugin) van bao do.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kiem tra gioi han description
        run: python3 scripts/check_descriptions.py

      - name: Dong bo va nang version (chi tren main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:.claude-plugin/marketplace.json" 2>/dev/null; then
            git show "$BEFORE:.claude-plugin/marketplace.json" > /tmp/marketplace-before.json
            python3 scripts/sync_marketplace.py --bump --baseline /tmp/marketplace-before.json
          else
            echo "Khong doc duoc catalog cua commit truoc ($BEFORE), chi so voi plugin.json"
            python3 scripts/sync_marketplace.py --bump
          fi

      - name: Commit nguoc lai neu co thay doi
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain .claude-plugin/marketplace.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .claude-plugin/marketplace.json
            git commit -m "chore: dong bo marketplace.json [skip ci]"
            git push
          else
            echo "marketplace.json da khop, khong can commit"
          fi

      - name: Kiem tra dong bo (nhanh khac / pull request)
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: python3 scripts/sync_marketplace.py --check
